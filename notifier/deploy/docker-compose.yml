# Run from the repository root, and pass --env-file:
#   docker compose --env-file .env -f notifier/deploy/docker-compose.yml up -d --build
#
# --env-file is not optional. Compose resolves `.env` relative to the *compose file's*
# directory, not the one you run the command in, so without it Compose looks for
# notifier/deploy/.env, finds nothing, and the ${...:?} guards below abort the run.
# Verified: the bare command fails with "required variable TELEGRAM_CHAT_ID is missing".
services:
  notifier:
    build:
      context: ../..
      dockerfile: notifier/deploy/Dockerfile
    image: fpl-notifier
    container_name: fpl-notifier

    # Named individually rather than with `env_file: .env`. That file also holds
    # ANTHROPIC_API_KEY for the dashboard, which this service has no use for -- there is
    # no reason to put it inside a container that talks only to Telegram, OpenRouter and
    # the two Premier League APIs. `:?` fails the run with a named variable rather than
    # starting a notifier that can never send anything.
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?set TELEGRAM_CHAT_ID in .env}
      NOTIFIER_TZ: ${NOTIFIER_TZ:-Europe/London}
      NOTIFIER_POLL_SECONDS: ${NOTIFIER_POLL_SECONDS:-60}
      NOTIFIER_REFRESH_SECONDS: ${NOTIFIER_REFRESH_SECONDS:-3600}
      # Empty defaults, because both are optional -- but they have to be listed. This
      # block names every variable individually rather than mounting .env wholesale, so
      # a variable absent from here is simply invisible inside the container: the
      # service would start clean, log nothing, and quietly emit only the six lines
      # that need no roster. Add new NOTIFIER_* settings here as well as to .env.
      NOTIFIER_ROSTER: ${NOTIFIER_ROSTER:-}
      NOTIFIER_BANTER: ${NOTIFIER_BANTER:-on}
      # The AI banter's four. Absent, the service still starts and still sends -- it
      # just uses the twenty built-in lines, which is the same thing an unset key means
      # anywhere else. OPENROUTER_API_KEY is the one secret here beyond the bot token.
      NOTIFIER_FPL_LEAGUE_ID: ${NOTIFIER_FPL_LEAGUE_ID:-}
      NOTIFIER_DRAFT_LEAGUE_ID: ${NOTIFIER_DRAFT_LEAGUE_ID:-}
      NOTIFIER_BANTER_AI: ${NOTIFIER_BANTER_AI:-on}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      NOTIFIER_BANTER_MODEL: ${NOTIFIER_BANTER_MODEL:-}
      NOTIFIER_BANTER_ALIASES: ${NOTIFIER_BANTER_ALIASES:-}

    # A named volume, not a bind mount. The container runs as uid 10001, and a bind
    # mount would arrive owned by the host user, so the first save would fail with
    # EACCES -- which the service survives by design, logging and carrying on, meaning
    # you would only notice when a restart re-sent an alert.
    volumes:
      - notifier-state:/data

    # Restarting freely is safe: sent keys live in the volume, so a restart cannot
    # re-send, and a moment already past is retired silently rather than announced.
    restart: unless-stopped

    # Nothing listens, nothing is served, and the only writable path is the volume.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  notifier-state:
